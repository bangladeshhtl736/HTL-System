<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Module - HTL</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border mb-4">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="bg-slate-800 text-white px-3.5 py-1.5 rounded-md text-xs font-semibold">&larr; Back to Portal</a>
        <h2 class="text-lg font-bold text-blue-700">1. Planning Module</h2>
      </div>
    </div>

    <!-- 3 Sub Navigators -->
    <div class="bg-slate-800 p-3 rounded-xl shadow mb-6">
      <div class="text-xs text-slate-400 font-semibold mb-2 uppercase">Sub Navigators:</div>
      <div class="flex space-x-3">
        <button onclick="switchSub('Update Data')" class="bg-blue-600 text-white py-2 px-5 rounded-lg text-xs font-bold">Update Data</button>
        <button onclick="switchSub('Schedule')" class="bg-white text-slate-800 hover:bg-slate-100 py-2 px-5 rounded-lg text-xs font-bold">Schedule</button>
        <button onclick="switchSub('Reserve Data')" class="bg-white text-slate-800 hover:bg-slate-100 py-2 px-5 rounded-lg text-xs font-bold">Reserve Data</button>
      </div>
    </div>

    <main class="bg-white p-6 rounded-xl shadow border min-h-[350px]">
      <h3 id="sub-title" class="text-base font-bold text-slate-800 mb-4">Planning -> Update Data</h3>
      <form onsubmit="event.preventDefault(); alert('Saved!');" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs bg-slate-50 p-4 rounded border">
        <div><label class="block font-semibold mb-1">Discrete Job</label><input type="text" class="border p-2 w-full rounded" required></div>
        <div><label class="block font-semibold mb-1">Customer Name</label><input type="text" class="border p-2 w-full rounded" required></div>
        <div><label class="block font-semibold mb-1">Planned Qty</label><input type="number" class="border p-2 w-full rounded" required></div>
        <div class="col-span-full"><button class="bg-blue-600 text-white px-6 py-2 rounded font-bold">Save Record</button></div>
      </form>
    </main>
  </div>
  <script>
    function switchSub(name) { document.getElementById('sub-title').innerText = "Planning -> " + name; }
  </script>
</body>
</html>
